name: Munich AI Job Alert

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths: [.github/workflows/job-alert.yml]

  schedule:
    # Backup only. The primary Supabase trigger runs at :00/:15/:30/:45.
    - cron: "7,22,37,52 * * * *"

permissions:
  actions: read
  contents: read

concurrency:
  group: munich-ai-job-alert
  cancel-in-progress: false

jobs:
  run-job-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Skip a backup scan if an actual scan recently completed
        id: freshness
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/radar_schedule.py gate

      - name: Run job alert
        if: steps.freshness.outputs.run_scan == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -o pipefail
          python main.py | tee radar-run.log

      - name: Preserve trial metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-trial-${{ github.run_id }}
          path: |
            run-metrics.json
            radar-run.log
          retention-days: 30
